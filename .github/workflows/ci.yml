name: CI and security

on:
  pull_request:
    branches: [product]
  push:
    branches: [product]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e-and-build:
    name: Full-stack tests and production build
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orbital_dispatcher_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      SPA_URL: http://127.0.0.1:5173
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173,127.0.0.1:8000,localhost:5173,localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: orbital_dispatcher_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip
          tools: composer:v2
          coverage: none
      - name: Install server dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist
      - name: Audit PHP dependencies
        working-directory: server
        run: composer audit --locked
      - name: Check PHP formatting
        working-directory: server
        run: vendor/bin/pint --test
      - name: Create clean test database schema
        working-directory: server
        run: php artisan migrate:fresh --force
      - name: Run Laravel feature tests
        working-directory: server
        run: php artisan test --compact
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Reset schema for browser scenarios
        working-directory: server
        run: php artisan migrate:fresh --force
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:preview
      - name: Install production PHP dependencies
        run: composer install --working-dir=server --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Package Laravel application
        run: tar -czf /tmp/orbital-dispatcher-release.tar.gz --exclude='./.env' -C server .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orbital-dispatcher-production-app
          path: server/public/app/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orbital-dispatcher-laravel-release
          path: /tmp/orbital-dispatcher-release.tar.gz
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency, secret, and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check semgrep==1.182.1
      - run: npm run security:static
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'

  deploy-production:
    name: Deploy to REG.RU shared hosting
    if: github.event_name == 'push' && github.ref == 'refs/heads/product' && vars.DEPLOY_ENABLED == 'true'
    needs: [quality, e2e-and-build, security]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbital-dispatcher-laravel-release
      - name: Configure verified SSH access
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$DEPLOY_PRIVATE_KEY" || { echo 'Missing DEPLOY_SSH_PRIVATE_KEY secret'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Missing DEPLOY_KNOWN_HOSTS variable'; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload release package
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -eu
          test -n "$DEPLOY_SSH_HOST" || { echo 'Missing DEPLOY_SSH_HOST variable'; exit 1; }
          test -n "$DEPLOY_SSH_USER" || { echo 'Missing DEPLOY_SSH_USER variable'; exit 1; }
          test -n "$DEPLOY_SSH_PORT" || { echo 'Missing DEPLOY_SSH_PORT variable'; exit 1; }
          scp -i "$HOME/.ssh/id_ed25519" -P "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            orbital-dispatcher-release.tar.gz \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:apps/orbital-dispatcher/release-$GITHUB_SHA.tar.gz"
      - name: Install release and run migrations
        env:
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/id_ed25519" -p "$DEPLOY_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -eu
          release_sha="$1"
          app_path="$HOME/apps/orbital-dispatcher"
          archive="$app_path/release-$release_sha.tar.gz"
          cd "$app_path"
          test -f .env || { echo 'Missing production .env; create it outside the public directory before enabling deployment.'; exit 1; }
          if grep -q '^APP_ENV=production$' .env && ! grep -q '^MAIL_MAILER=smtp$' .env; then
            rm -f "$archive"
            echo 'Production password-reset email is disabled: configure the REG.RU SMTP mailer in the private server .env before deploying.'
            exit 1
          fi
          tar -xzf "$archive" -C "$app_path" --no-same-owner
          rm -f "$archive"
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache
          /opt/php/8.3/bin/php artisan config:clear
          /opt/php/8.3/bin/php artisan migrate --force
          /opt/php/8.3/bin/php artisan optimize:clear
          site_root="$HOME/www/portfolioskolkoff.ru"
          public_root="$site_root/public"
          mkdir -p "$public_root"
          cp -a "$app_path/public/." "$public_root/"
          rm -f "$public_root/index.html"
          sed -i \
            -e "s|__DIR__.'/../storage/framework/maintenance.php'|'$app_path/storage/framework/maintenance.php'|" \
            -e "s|__DIR__.'/../vendor/autoload.php'|'$app_path/vendor/autoload.php'|" \
            -e "s|__DIR__.'/../bootstrap/app.php'|'$app_path/bootstrap/app.php'|" \
            "$public_root/index.php"
          /opt/php/8.3/bin/php -l "$public_root/index.php"
          REMOTE
