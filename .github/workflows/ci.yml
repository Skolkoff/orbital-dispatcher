name: CI and security

on:
  pull_request:
    branches: [product]
  push:
    branches: [product]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e-and-build:
    name: Full-stack tests and production build
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orbital_dispatcher_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      SPA_URL: http://127.0.0.1:5173
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173,127.0.0.1:8000,localhost:5173,localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: orbital_dispatcher_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: database
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, xml, curl, zip
          tools: composer:v2
          coverage: none
      - name: Install server dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist
      - name: Audit PHP dependencies
        working-directory: server
        run: composer audit --locked
      - name: Check PHP formatting
        working-directory: server
        run: vendor/bin/pint --test
      - name: Create clean test database schema
        working-directory: server
        run: php artisan migrate:fresh --force
      - name: Run Laravel feature tests
        working-directory: server
        run: php artisan test --compact
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Reset schema for browser scenarios
        working-directory: server
        run: php artisan migrate:fresh --force
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:preview
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orbital-dispatcher-production-app
          path: server/public/app/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency, secret, and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check semgrep==1.182.1
      - run: npm run security:static
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.30.1'
